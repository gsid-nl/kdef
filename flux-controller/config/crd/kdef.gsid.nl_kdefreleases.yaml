apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kdefreleases.kdef.gsid.nl
spec:
  group: kdef.gsid.nl
  names:
    kind: KdefRelease
    listKind: KdefReleaseList
    plural: kdefreleases
    singular: kdefrelease
    shortNames:
      - kr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"
        - name: Status
          type: string
          jsonPath: ".status.conditions[?(@.type==\"Ready\")].message"
        - name: Revision
          type: string
          jsonPath: ".status.lastAppliedRevision"
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - sourceRef
                - interval
              properties:
                sourceRef:
                  type: object
                  required:
                    - kind
                    - name
                  properties:
                    kind:
                      type: string
                      enum: [GitRepository, OCIRepository, Bucket]
                    name:
                      type: string
                    namespace:
                      type: string
                path:
                  type: string
                env:
                  type: string
                set:
                  type: object
                  additionalProperties:
                    type: string
                valuesFrom:
                  type: object
                  required:
                    - kind
                    - name
                  properties:
                    kind:
                      type: string
                      enum: [ConfigMap, Secret]
                    name:
                      type: string
                    key:
                      type: string
                interval:
                  type: string
                  pattern: "^[0-9]+(ms|s|m|h)$"
                prune:
                  type: boolean
                targetNamespace:
                  type: string
                serviceAccountName:
                  type: string
                suspend:
                  type: boolean
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                lastAppliedRevision:
                  type: string
                lastAttemptedRevision:
                  type: string
                inventory:
                  type: object
                  properties:
                    entries:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          v:
                            type: string
                observedGeneration:
                  type: integer
                  format: int64
